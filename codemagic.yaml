workflows:
  ios-release:
    name: iOS Release
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        OPENROUTER_API_KEY: $OPENROUTER_API_KEY
        ELEVENLABS_API_KEY: $ELEVENLABS_API_KEY
        GOOGLE_API_KEY: $GOOGLE_API_KEY
        PIPER_ENABLED: false
        WAKE_WORD: ultron
    scripts:
      - sed -i '' "s|OPENROUTER_API_KEY=.*|OPENROUTER_API_KEY=$OPENROUTER_API_KEY|" .env
      - sed -i '' "s|ELEVENLABS_API_KEY=.*|ELEVENLABS_API_KEY=$ELEVENLABS_API_KEY|" .env
      - sed -i '' "s|GOOGLE_API_KEY=.*|GOOGLE_API_KEY=$GOOGLE_API_KEY|" .env
      - sed -i '' "s|WAKE_WORD=.*|WAKE_WORD=$WAKE_WORD|" .env
      - flutter pub get
      - cd ios && pod install && cd ..
      - flutter build ios --release --no-codesign
    artifacts:
      - build/ios/iphoneos/*.app
      - build/ios/ipa/*.ipa

  android-release:
    name: Android Release
    instance_type: standard
    environment:
      flutter: stable
      vars:
        OPENROUTER_API_KEY: $OPENROUTER_API_KEY
        ELEVENLABS_API_KEY: $ELEVENLABS_API_KEY
        GOOGLE_API_KEY: $GOOGLE_API_KEY
        PIPER_ENABLED: false
        WAKE_WORD: ultron
    scripts:
      - sed -i '' "s|OPENROUTER_API_KEY=.*|OPENROUTER_API_KEY=$OPENROUTER_API_KEY|" .env
      - sed -i '' "s|ELEVENLABS_API_KEY=.*|ELEVENLABS_API_KEY=$ELEVENLABS_API_KEY|" .env
      - sed -i '' "s|GOOGLE_API_KEY=.*|GOOGLE_API_KEY=$GOOGLE_API_KEY|" .env
      - sed -i '' "s|WAKE_WORD=.*|WAKE_WORD=$WAKE_WORD|" .env
      - flutter pub get
      - flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk