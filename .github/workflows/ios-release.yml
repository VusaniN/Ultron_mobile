name: iOS Release IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          cache: true

      - name: Inject API keys
        run: |
          sed -i '' "s|OPENROUTER_API_KEY=.*|OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}|" .env
          sed -i '' "s|ELEVENLABS_API_KEY=.*|ELEVENLABS_API_KEY=${{ secrets.ELEVENLABS_API_KEY }}|" .env
          sed -i '' "s|GOOGLE_API_KEY=.*|GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}|" .env

      - name: Build release IPA
        run: |
          flutter pub get
          cd ios && pod install && cd ..
          flutter build ios --release --no-codesign
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa && zip -r ultron_release.ipa Payload/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ultron_release.ipa
          path: build/ios/ipa/ultron_release.ipa
